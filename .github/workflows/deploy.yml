name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: "latest"

      - name: Build shellcide
        run: |
          cd shellcide
          trunk build --release --public-url /projects/shellcide/

      - name: Move shellcide build to static/projects/shellcide
        run: |
          mkdir -p static/projects/shellcide
          rm -rf static/projects/shellcide/*
          cp -R shellcide/dist/* static/projects/shellcide/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install wasm-bindgen-cli
        uses: jetli/wasm-bindgen-action@v0.2.0
        with:
          version: "0.2.122"

      - name: Build pbkdf2-identifier
        run: |
          cd pbkdf2-identifier/gui
          npm install
          npm run build -- --base=/projects/pbkdf2-identifier/

      - name: Move pbkdf2-identifier build to static/projects/pbkdf2-identifier
        run: |
          mkdir -p static/projects/pbkdf2-identifier
          rm -rf static/projects/pbkdf2-identifier/*
          cp -R pbkdf2-identifier/gui/dist/* static/projects/pbkdf2-identifier/

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy-server:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: zer0x64.com
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: artifact

      - name: Extract build artifact
        run: tar -xf artifact/artifact.tar -C artifact && rm artifact/artifact.tar

      - name: Deploy via rsync
        run: |
          eval "$(ssh-agent -s)"
          echo $SSH_PRIVATE_KEY | base64 -d | ssh-add -
          mkdir -p ~/.ssh
          ssh-keyscan zer0x64.com >> ~/.ssh/known_hosts
          rsync -avz --delete artifact/ github-actions@zer0x64.com:/var/www/html/zer0x64.com/
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
